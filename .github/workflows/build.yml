
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/android-source"

          FOUND=0

          while IFS= read -r -d '' ZIP; do
            echo "Extracting: $ZIP"
            unzip -oq "$ZIP" -d "$RUNNER_TEMP/android-source"
            FOUND=1
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

      - name: Accept Android licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          mapfile -t PROJECTS < <(
            find "$RUNNER_TEMP/android-source" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -printf '%h\n'
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "::error::No settings.gradle found inside extracted ZIP files."
            find "$RUNNER_TEMP/android-source" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file missing."
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Download Gradle 8.4
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.4-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          "$RUNNER_TEMP/gradle-8.4/bin/gradle" \
            --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRCRip-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
