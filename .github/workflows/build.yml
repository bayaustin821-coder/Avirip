name: Build VRCRip APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrcrip-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Clean Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out latest repository commit
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here: it attempts to
      # install the obsolete SDK package "tools" and fails on current SDKs.
      - name: Set up Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK command-line tools were not found on the runner."
              exit 1
            fi
            echo "Using sdkmanager at $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract and locate Android project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vrcrip-source"
          mkdir -p "$WORK"

          if [ -f "$GITHUB_WORKSPACE/VRCRip_fixed_build.zip" ]; then
            echo "Extracting VRCRip_fixed_build.zip"
            unzip -q -o "$GITHUB_WORKSPACE/VRCRip_fixed_build.zip" -d "$WORK"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            echo "Using Gradle project at repository root"
            cp -a "$GITHUB_WORKSPACE/." "$WORK/"
          else
            echo "::error::Could not find VRCRip_fixed_build.zip or a Gradle project in the repository root."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          SETTINGS="$(find "$WORK" -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts was found in the source."
            find "$WORK" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The selected project has no app/build.gradle or app/build.gradle.kts."
            find "$PROJECT_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Selected Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build fresh debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf .gradle build app/build

          GRADLE_VERSION="8.4"
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" \
            --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            clean :app:assembleDebug

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed without producing a debug APK."
            exit 1
          fi

          OUT="$RUNNER_TEMP/vrcrip-artifacts"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/VRCRip-debug.apk"
          sha256sum "$OUT/VRCRip-debug.apk" > "$OUT/SHA256SUMS.txt"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Source project: $PROJECT_DIR"
            echo "APK checksum:"
            sha256sum "$OUT/VRCRip-debug.apk"
          } > "$OUT/BUILD-INFO.txt"

      - name: Upload uniquely named APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCRip-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vrcrip-artifacts/*
          if-no-files-found: error
          retention-days: 30
