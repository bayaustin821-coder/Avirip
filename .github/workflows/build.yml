name: Build VRCRip APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrcrip-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Clean Android build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out latest repository commit
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Prefer the newly uploaded project archive. Do not silently build the
      # older VRCRip_complete_repository.zip when the fixed archive is present.
      - name: Prepare source project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vrcrip-source"
          mkdir -p "$WORK"

          if [ -f "$GITHUB_WORKSPACE/VRCRip_fixed_build.zip" ]; then
            echo "Using VRCRip_fixed_build.zip from this commit."
            unzip -q -o "$GITHUB_WORKSPACE/VRCRip_fixed_build.zip" -d "$WORK"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            echo "No fixed-build archive found; using Gradle project in repository root."
            cp -a "$GITHUB_WORKSPACE/." "$WORK/"
          else
            echo "::error::VRCRip_fixed_build.zip or a root Gradle project is required."
            echo "Files at repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          PROJECT_DIR="$(find "$WORK" -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::The selected source does not contain settings.gradle."
            find "$WORK" -maxdepth 5 -type f | sort | head -250
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The selected Gradle project has no app/build.gradle."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Building project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build a fresh APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Remove any APKs/build outputs carried in the source archive.
          rm -rf app/build build .gradle
          rm -f app/build/outputs/apk/debug/*.apk

          GRADLE_VERSION="8.4"
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" \
            --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            clean :app:assembleDebug

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no debug APK was produced."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vrcrip-artifacts"
          cp "$APK" "$RUNNER_TEMP/vrcrip-artifacts/VRCRip-debug.apk"
          sha256sum "$RUNNER_TEMP/vrcrip-artifacts/VRCRip-debug.apk" \
            | tee "$RUNNER_TEMP/vrcrip-artifacts/SHA256SUMS.txt"

          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Built from: $PROJECT_DIR"
            echo "APK SHA-256:"
            sha256sum "$RUNNER_TEMP/vrcrip-artifacts/VRCRip-debug.apk"
          } > "$RUNNER_TEMP/vrcrip-artifacts/BUILD-INFO.txt"

      - name: Upload uniquely named APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCRip-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vrcrip-artifacts/*
          if-no-files-found: error
          retention-days: 30
