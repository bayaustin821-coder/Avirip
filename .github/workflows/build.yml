
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK manager not found"
            exit 1
          fi
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)"
          if [ -z "$DIR" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Download Gradle 8.4
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          "$RUNNER_TEMP/gradle-8.4/bin/gradle" \
            --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRCRip-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
